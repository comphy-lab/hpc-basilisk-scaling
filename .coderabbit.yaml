# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "en-GB"
early_access: false

reviews:
  profile: "chill"
  high_level_summary: true
  path_filters:
    - "!docs/**"
    - "!.github/docs/**"
    - "!basilisk/**"
    - "!generated/**"
    - "!results/**"
    - "!**/*.tsv"
    - "!**/*.csv"
    - "!**/*.dat"
    - "!**/*.png"
    - "!**/*.pdf"
  path_instructions:
    - path: "simulationCases/mpi-circle.c"
      instructions: |
        Unmodified stock Basilisk test from basilisk.fr. Do not suggest
        local physics or style fixes. Flag only accidental local edits.
    - path: "simulationCases/mpi-laplacian.c"
      instructions: |
        Unmodified stock Basilisk test from basilisk.fr. Do not suggest
        local physics or style fixes. Flag only accidental local edits.
    - path: "simulationCases/marangoni.c"
      instructions: |
        Unmodified basilisk.fr src/test/marangoni.c. Do not edit it.
    - path: "simulationCases/marangoni-scale.c"
      instructions: |
        Axisymmetric Al Saud cluster I/O variant. Check dump/restore,
        LEVEL argv, rank-0 logging, and UNIFORM vs adaptive. Not stock.
    - path: "simulationCases/marangoni-multidrop.c"
      instructions: |
        Planar n-drop Marangoni cluster I/O variant. Check dump/restore,
        drop lattice, rank-0 logging, and UNIFORM vs adaptive. Not stock.
    - path: "simulationCases/marangoni-interact.c"
      instructions: |
        Planar eight-drop radial-sigma showcase. Check dump/restore,
        LEVEL/TMAX argv, and MPI-safe output. Not stock basilisk.fr.
    - path: "simulationCases/activity-*.c"
      instructions: |
        HPC-oriented active-drop solver derived from
        comphy-lab/active-drops-with-memory. Check parameter parsing,
        custom-layout bounds, dump/restore, and MPI-safe output.
    - path: "src-local/**"
      instructions: |
        Custom Basilisk headers. Check include-order compatibility and
        that tracer attributes match activity-drop.c.
    - path: "scripts/**"
      instructions: |
        HPC staging and compile helpers. Never hardcode a machine-local qcc
        path; resolve with $BASILISK or `which qcc`. Review quoting, set -euo
        pipefail, and fail-closed argument checks.
    - path: "slurm/**"
      instructions: |
        MareNostrum5 GPP batch scripts. Check account/QoS, exclusive node
        use, no login-node compute, and that srun rank counts match
        SLURM_NTASKS.
    - path: "postProcess/**"
      instructions: |
        Scaling plots and snapshot movies. Timer parsers must stay
        compatible with Basilisk #TIMING lines. Frame movies must sort
        by numeric snapshot time, compile get_* helpers once, and use
        mathtext (not usetex) when rendering in parallel.
    - path: "AGENTS.md"
      instructions: |
        Canonical repo operating manual. Check for stale state, broken
        references, and contradictions with the actual repo layout.
  tools:
    cppcheck:
      enabled: false
    shellcheck:
      enabled: true
    ruff:
      enabled: true
    markdownlint:
      enabled: true
    actionlint:
      enabled: true
