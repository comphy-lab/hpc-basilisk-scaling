# Single chemically fuelled drop. Domain 10R, ~102 pts/R at max_level 10.
# Compile activity-drop.c, then:
#   mpirun -np N ./activity-drop --params simulationCases/activity-single.cfg
Oh = 1.0
Ca = 0.1
Pe = 1.6
AcNum = 1.0
domain = 10.0
layout = lattice
drops = 1
drop_radius = 1.0
drop_spacing = 3.0
max_level = 10
min_level = 7
tmax = 10.0
tsnap = 0.5
ke_limit = 1e4
output_dir = .
resume = 0
